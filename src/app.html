<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="IronLog" />
		<meta name="theme-color" content="#f97316" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<script>
		// Suppress iOS "Undo Typing" / shake-to-undo dialog
		// Must intercept both beforeinput AND selectionchange to fully block iOS undo
		document.addEventListener('beforeinput', function(e) {
			if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
				e.preventDefault();
				e.stopPropagation();
				e.stopImmediatePropagation();
				return false;
			}
		}, { capture: true, passive: false });

		// Also intercept at window level
		window.addEventListener('beforeinput', function(e) {
			if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
				e.preventDefault();
				e.stopImmediatePropagation();
			}
		}, { capture: true, passive: false });
	</script>
	%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-zinc-950 text-zinc-50 antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
